name: Build and publish artifacts

on:
  push:
    tags:
      - "[0-9]*"
    branches:
      - dev
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (비우면 게임 버전)"
        required: false
        type: string
      publish:
        description: "릴리스로 게시 (끄면 빌드 결과를 아티팩트로만 남김)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_type == 'branch' && github.event_name == 'push' && 'dev' || 'tag' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'push' }}

env:
  NAME: DoLX-KR
  TITLE: DoLX KR
  APP_PACKAGE: io.github.instplace.dolxkr
  APP_NAME: Degrees of Lewdity X-Change KR
  APP_SHORT: DoLX KR

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 버전과 태그
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="$(grep -oP '(?<=DoLX )[0-9]+(\.[0-9]+)*[a-z]*' version | head -n 1)"
          base="$(grep -oP '^[0-9]+(\.[0-9]+)*' version | head -n 1)"
          if [ -z "$version" ] || [ -z "$base" ]; then echo "::error::version 파일에서 DoLX 버전을 읽지 못했습니다"; exit 1; fi
          echo "BASE_VERSION=$base" >> "$GITHUB_ENV"
          prerelease=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then tag="dev"; prerelease=true
          else tag="${INPUT_TAG:-$version}"; fi
          if ! printf '%s' "$tag" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$'; then echo "::error::태그 이름이 올바르지 않습니다: $tag"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "DoLX $version (원작 $base), 태그 $tag, 개발판 $prerelease"

      # 개발판은 게임 화면 오른쪽 위의 판 이름과 오류 상자 머리에 "dev 커밋"을 붙여, 어느 빌드인지 알아볼 수 있게 한다.
      - name: 개발판 레이블
        if: env.PRERELEASE == 'true'
        run: |
          label="dev ${GITHUB_SHA:0:8}"
          config=game/01-config/sugarcubeConfig.js
          sed -i -E "s/^(\s*versionName: \`[^\`]*)\`,/\1 ($label)\`,/" "$config"
          sed -i -E "s/^(\s*)version: (\"[^\"]+\"),/\1version: \2,\n\1build: \"$label\",/" "$config"
          grep -n "versionName\|build:\|version:" "$config"
          grep -q "build: \"$label\"" "$config"
          grep -q "($label)\`" "$config"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: HTML 컴파일
        run: |
          chmod +x compile.sh devTools/tweego/tweego_linux64
          FORCE_VERSION="$VERSION" ./compile.sh
          test -s "Degrees of Lewdity $VERSION.html"

      # 게임 파일과 img/, img2/, audio/를 한 zip에 담는다 (DoLX는 기본 이미지가 img/에 들어 있다).
      - name: PC용 zip
        run: |
          mkdir -p out
          name="$NAME-$TAG"
          dir="out/$name"
          mkdir -p "$dir"
          cp "Degrees of Lewdity $VERSION.html" "$dir/"
          cp -r img img2 audio "$dir/"
          cp LICENSE DoLX_Changelog.md "$dir/"
          (cd out && zip -qr -9 "$name.zip" "$name" && rm -r "$name")
          if [ "$PRERELEASE" != "true" ]; then
            mkdir -p "out/$name-HTML_only"
            cp "Degrees of Lewdity $VERSION.html" LICENSE "out/$name-HTML_only/"
            (cd out && zip -qr -9 "$name-HTML_only.zip" "$name-HTML_only" && rm -r "$name-HTML_only")
          fi
          ls -la out

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Android SDK
        run: |
          set +o pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "build-tools;32.0.0" "platforms;android-32" > /dev/null
          test -x "$ANDROID_HOME/build-tools/32.0.0/apksigner"

      # 앱에는 저장소의 img/, img2/, audio/가 그대로 들어간다 (scripts/prepare_files.js).
      - name: 안드로이드용 HTML과 이미지
        run: |
          sed -i 's/enableLinkNumberify: true/enableLinkNumberify: false/' game/01-config/sugarcubeConfig.js
          grep -q 'enableLinkNumberify: false' game/01-config/sugarcubeConfig.js
          FORCE_VERSION="$VERSION" ./compile.sh
          test -s "Degrees of Lewdity.html"
          test -d img && test -d audio

      - name: 앱 이름과 패키지
        working-directory: devTools/apkbuilder
        run: |
          sed -i "s/android-packageName=\"[^\"]*\"/android-packageName=\"$APP_PACKAGE\"/" config.xml
          sed -i "s/ version=\"[^\"]*\"/ version=\"$VERSION\"/" config.xml
          sed -i "s|<name short=\"[^\"]*\">[^<]*</name>|<name short=\"$APP_SHORT\">$APP_NAME</name>|" config.xml
          grep -q "android-packageName=\"$APP_PACKAGE\"" config.xml
          grep -q " version=\"$VERSION\"" config.xml
          grep -q ">$APP_NAME</name>" config.xml

      - name: 서명 키
        env:
          KEYSTORE_BASE64: ${{ secrets.DOL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DOL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::서명 키 시크릿(DOL_KEYSTORE_BASE64, DOL_KEYSTORE_PASSWORD)이 없어 APK는 게시하지 않습니다. 빌드가 되는지만 디버그 빌드로 확인합니다."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SIGNED=true" >> "$GITHUB_ENV"
          mkdir -p keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keys/dol.keystore
          node -e '
            const fs = require("fs"), path = require("path");
            const password = process.env.KEYSTORE_PASSWORD;
            const release = { keystore: path.resolve("keys/dol.keystore"), storePassword: password, password, alias: "dol", keystoreType: "pkcs12", packageType: "apk" };
            fs.writeFileSync("devTools/apkbuilder/build.json", JSON.stringify({ android: { release } }));
          '

      - name: APK 빌드
        working-directory: devTools/apkbuilder
        run: |
          npm install --no-audit --no-fund
          npx cordova telemetry off
          npx cordova prepare
          if [ "$SIGNED" = "true" ]; then
            BUILD_RELEASE=true SKIP_PASSWORD=true node scripts/build_app.js
          else
            node scripts/build_app.js
          fi

      - name: APK 확인
        run: |
          tools="$ANDROID_HOME/build-tools/32.0.0"
          ls -la dist
          if [ "$SIGNED" = "true" ]; then
            apk="$(ls dist/*-release.apk | head -n 1)"
            cp "$apk" "out/$NAME-$TAG.apk"
            "$tools/aapt" dump badging "out/$NAME-$TAG.apk" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion" | tee badging.txt
            grep -q "name='$APP_PACKAGE'" badging.txt
            grep -q "versionName='$VERSION'" badging.txt
            "$tools/apksigner" verify --print-certs "out/$NAME-$TAG.apk" | grep -E "^Signer #1 certificate (DN|SHA-256)"
          else
            apk="$(ls dist/*-debug.apk | head -n 1)"
            "$tools/aapt" dump badging "$apk" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion"
          fi
          rm -f keys/dol.keystore devTools/apkbuilder/build.json
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-${{ env.TAG }}
          path: out/*
          retention-days: 7
          compression-level: 0

      - name: 릴리스 게시
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{BASE_VERSION}}/$BASE_VERSION/g" .github/release-notes.md > notes.md
          files=(out/*.zip)
          if [ "$SIGNED" = "true" ]; then files+=("out/$NAME-$TAG.apk"); fi
          if [ "$PRERELEASE" = "true" ]; then
            short="${GITHUB_SHA:0:8}"
            { printf '# [DEV BUILD]\n\n'; cat notes.md; } > notes-dev.md
            gh release create "$TAG-$short" "${files[@]}" --target "$GITHUB_SHA" --prerelease --title "$TITLE $VERSION (Dev $short)" --notes-file notes-dev.md
          elif gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" --title "$TITLE $VERSION" --notes-file notes.md
          fi
