name: 코드/매크로 오류
description: 게임 플레이하다가 오류 뜨면 이거
title: "[오류] "
labels: ["코드 오류", "확인 필요"]
type: bug
body:
  - type: dropdown
    id: environment
    attributes:
      label: 실행 방식
      description: 어떤 환경에서 발생한 문제인가요?
      options: 
        - d.pla.is
        - 로컬 Web
        - Android 앱
        - 환경 상관 없이 발생함
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 어떤 일이 일어났나요?
      description: 설명이 상세할 수록 빠르게 확인이 가능합니다.
      placeholder: 실행 환경 (브라우저, 기기 정보 등) 및 예상 상황, 무엇이 되어야 했는데 안 됐는지 등을 포함하는 걸 권장
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: 상세 스크린샷
      description: 스크린샷 첨부가 가능하다면 추가해주세요.
    validations:
      required: false
