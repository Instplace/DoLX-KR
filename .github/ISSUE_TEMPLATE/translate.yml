name: 번역 오류
description: 문구가 이상하거나 잘못 표시되면 이거
title: "[번역] "
labels: ["번역 오류", "확인 필요"]
type: bug
body:
  - type: dropdown
    id: category
    attributes:
      label: 어떤 종류의 번역 문제인가요?
      description: 목록에 해당하는 내용이 없으면 기타로 작성하세요.
      options:
        - 장면 내 반말/존댓말 혼용
        - 번역 자체가 잘못됨 (단어나 의미를 틀림)
        - 과도한 의역 (번역으로 인해 의미가 달라짐)
        - 고유명사가 일관적으로 표시되지 않음
        - 그 외 나머지
    validations:
      required: true
  - type: input
    id: passage
    attributes:
      label: 어떤 상황에서 표시되는 텍스트인가요?
      description: 정확한 표시 위치를 알면 좋고, 모른다면 대략적인 상태만 적어주세요.
      placeholder: 로빈의 레모네이드 가판대 도움을 주던 중
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 해당 상황에서 어떻게 표시되는 게 문제인가요?
      description: 의역/오역이라고 생각하는 경우 맞는 것 같은 의미를 함께 포함해주세요.
      placeholder: 로빈이 레모네이드 판매할 때는 반말하다가 판매 끝나니까 갑자기 존댓말을 함
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: 상세 스크린샷
      description: 스크린샷 첨부가 가능하다면 추가해주세요.
    validations:
      required: false
